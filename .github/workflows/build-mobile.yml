name: 📱 Build FoodHub Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: 🤖 Build Android APK & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Configure Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "::add-mask::$SUPABASE_URL"
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_KEY" ]; then
            echo "::add-mask::$SUPABASE_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
          fi

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Assemble 3 Separate Android APKs
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Customer App APK (تطبيق العميل)
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Customer-App-APK
          path: android/app/build/outputs/apk/customer/debug/app-customer-debug.apk
          retention-days: 14

      - name: 📤 Upload Captain App APK (تطبيق المندوب)
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Captain-App-APK
          path: android/app/build/outputs/apk/captain/debug/app-captain-debug.apk
          retention-days: 14

      - name: 📤 Upload Kitchen Partner App APK (تطبيق المتجر والمطبخ)
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Kitchen-App-APK
          path: android/app/build/outputs/apk/kitchen/debug/app-kitchen-debug.apk
          retention-days: 14

  build-ios:
    name: 🍏 Build iOS Workspace & Archive
    runs-on: macos-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Configure Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "::add-mask::$SUPABASE_URL"
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_KEY" ]; then
            echo "::add-mask::$SUPABASE_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
          fi

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🍎 Add & Sync Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Compile iOS App & Package IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          cd ../..
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "App.app" | head -n 1)
          fi

          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/App.app

          cd build
          zip -r FoodHub-iOS-Package.ipa Payload
          zip -r FoodHub-iOS-App.zip Payload/App.app
          ls -lh

      - name: 📤 Upload iOS IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-iOS-Package
          path: build/FoodHub-iOS-Package.ipa
          retention-days: 14

      - name: 📤 Upload iOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-iOS-App-Bundle
          path: build/FoodHub-iOS-App.zip
          retention-days: 14
