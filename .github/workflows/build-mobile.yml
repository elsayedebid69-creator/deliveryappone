name: 📱 Build FoodHub Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-mobile.yml'

jobs:
  build-android:
    name: 🤖 Build Android APK & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Assemble Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: 🍏 Build iOS Workspace & Archive
    runs-on: macos-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🍎 Add & Sync Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🛠️ Select Latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: 🔨 Archive iOS Application
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/FoodHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: 📤 Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-iOS-Archive
          path: build/FoodHub.xcarchive
          retention-days: 14
