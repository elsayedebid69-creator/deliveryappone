name: Build FoodHub mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Android / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, captain, kitchen, admin]
    env:
      FOODHUB_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected Android app
        run: bunx cap sync android
      - name: Build test APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          variant="${FOODHUB_APP^}"
          ./gradlew "assemble${variant}Debug" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-Android-Test-APK
          path: android/app/build/outputs/apk/${{ matrix.app }}/debug/app-${{ matrix.app }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: iOS / ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            display_name: FoodHub Customer
          - app: captain
            display_name: FoodHub Captain
          - app: kitchen
            display_name: FoodHub Kitchen
          - app: admin
            display_name: FoodHub Admin
    env:
      FOODHUB_APP: ${{ matrix.app }}
      FOODHUB_DISPLAY_NAME: ${{ matrix.display_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected iOS app
        run: bunx cap sync ios
      - name: Compile unsigned device app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          test -d build/device/Build/Products/Release-iphoneos/App.app
          ditto -c -k --keepParent build/device/Build/Products/Release-iphoneos/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Unsigned.zip"
      - name: Compile simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Unsigned-Device
          path: build/FoodHub-${{ matrix.app }}-iOS-Unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Simulator
          path: build/FoodHub-${{ matrix.app }}-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
