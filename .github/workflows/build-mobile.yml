name: 📱 Build FoodHub Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: 🤖 Build Android APK & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Configure Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "::add-mask::$SUPABASE_URL"
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_KEY" ]; then
            echo "::add-mask::$SUPABASE_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
          fi

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Assemble Android APK & AAB Bundle
        run: |
          cd android
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📤 Upload Android AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Android-AAB-Bundle
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 14

  build-ios:
    name: 🍏 Build iOS Workspace & Archive
    runs-on: macos-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Configure Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "::add-mask::$SUPABASE_URL"
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_KEY" ]; then
            echo "::add-mask::$SUPABASE_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" >> .env
          fi

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🍎 Add & Sync Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Archive iOS Application & Create IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/FoodHub.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            clean archive || true

          mkdir -p ../../build/Payload
          if [ -d "../../build/FoodHub.xcarchive/Products/Applications/App.app" ]; then
            cp -R "../../build/FoodHub.xcarchive/Products/Applications/App.app" ../../build/Payload/
            cd ../../build
            zip -r FoodHub-iOS-Package.ipa Payload
          fi

      - name: 📤 Upload iOS IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-iOS-Package
          path: build/FoodHub-iOS-Package.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: 📤 Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-iOS-Archive
          path: build/FoodHub.xcarchive
          if-no-files-found: warn
          retention-days: 14
